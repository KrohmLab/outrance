<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Roster — piste B : liste et aperçu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0712}
*{box-sizing:border-box}
a{color:#b98bff}a:hover{color:#f4f0fb}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding-left:clamp(16px,4vw,48px);padding-right:clamp(16px,4vw,48px)}
.disp{font-family:Unbounded,"Arial Black",sans-serif;text-transform:uppercase;margin:0}
.xl{font-size:clamp(44px,7vw,96px);line-height:.92;font-weight:800;letter-spacing:-.02em}
.l{font-size:clamp(34px,4.4vw,56px);line-height:1;font-weight:700;letter-spacing:-.01em}
.ttl{font-family:Unbounded,"Arial Black",sans-serif;font-size:21px;line-height:1.15;font-weight:600;margin:0;text-transform:uppercase}
.lbl{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;line-height:1.3;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-family:Unbounded,"Arial Black",sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;white-space:nowrap;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s,color .25s}
.btn-uv{background:#d4ff3a;color:#0a0712}.btn-uv:hover{color:#0a0712;transform:translateY(-2px);box-shadow:0 0 0 6px rgba(212,255,58,.16)}
.btn-lotus{background:#b98bff;color:#0a0712}.btn-lotus:hover{color:#0a0712;transform:translateY(-2px);box-shadow:0 0 0 6px rgba(185,139,255,.2)}
.btn-ghost{border:1.5px solid #73669a;color:#f4f0fb;background:transparent}.btn-ghost:hover{border-color:#b98bff;color:#f4f0fb;background:#2a1652}
.lnk{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#b98bff;text-decoration:none}
.lnk:hover{color:#f4f0fb}.lnk .ar{transition:transform .25s}.lnk:hover .ar{transform:translateX(5px)}
.nav a{color:#f4f0fb;text-decoration:none;font-family:Unbounded,"Arial Black",sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:14px 0}
.nav a:hover{color:#b98bff}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;color:#a99fc2;transition:color .2s,background .2s}
.icon:hover{color:#f4f0fb;background:#161022}
.card{background:#161022;border-radius:12px;overflow:hidden;text-decoration:none;color:#f4f0fb;display:flex;flex-direction:column;border:0;padding:0;text-align:left;font:inherit;cursor:pointer;transition:background .3s,transform .3s}
.card:hover{background:#2a1652;color:#f4f0fb;transform:translateY(-4px)}
.card:hover .zoom{transform:scale(1.04)}
.zoom{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.ph{position:relative;background:#120d1d;overflow:hidden;display:flex;align-items:flex-end;padding:14px}
.chip{min-height:44px;padding:0 20px;border-radius:999px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.field{display:flex;flex-direction:column;gap:8px;flex:1 1 220px}
.field input,.field select,.field textarea{min-height:52px;border-radius:4px;border:1.5px solid #73669a;background:#0a0712;color:#f4f0fb;padding:12px 16px;font:500 16px Manrope,system-ui,sans-serif}
.field textarea{min-height:140px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#b98bff;outline:none}
.x{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:999px;border:1.5px solid #73669a;background:#0a0712;color:#f4f0fb;cursor:pointer;transition:border-color .2s,transform .3s}
.x:hover{border-color:#b98bff;transform:rotate(90deg)}
:focus-visible{outline:2px solid #d4ff3a;outline-offset:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.3}}
.mandala{animation:spin 90s linear infinite;transform-origin:50% 50%}
.mandala-rev{animation:spin 140s linear infinite reverse;transform-origin:50% 50%}
.marquee{display:flex;width:max-content;animation:marquee 48s linear infinite}
.marquee:hover{animation-play-state:paused}
.reveal{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.still .mandala,.still .mandala-rev,.still .marquee,.still .pulse,.still .reveal{animation:none}
.past{transition:background .25s,padding .25s}.past:hover{background:#161022;padding-left:20px!important}
.past .ar{transition:transform .25s}.past:hover .ar{transform:translateX(6px)}
@media (prefers-reduced-motion:reduce){.mandala,.mandala-rev,.marquee,.pulse{animation:none}.reveal{animation-duration:.01s}}
.row{display:flex;align-items:center;gap:20px;width:100%;min-height:56px;padding:0 16px;border:0;border-top:1px solid #2e2645;color:#f4f0fb;font:inherit;text-align:left;cursor:pointer;transition:background .25s,box-shadow .25s}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes pop2{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes up2{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.row *{transition:none}}
.sec{width:1440px;padding:88px 128px;background:#0a0712;color:#f4f0fb;font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:40px;overflow:hidden}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}

</style>
</helmet>
<section class="sec" style="min-height: 800px">
<div class="shead">
<div style="display: flex; flex-direction: column; gap: 12px"><span class="lbl" style="color: #b98bff">Artistes</span><h2 class="disp l">Le roster</h2></div>
<a class="lnk" href="Artistes.dc.html">Fiches et booking <span class="ar" aria-hidden="true">→</span></a>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 56px; align-items: start">
<ol style="list-style: none; margin: 0; padding: 0; border-bottom: 1px solid #2e2645">
<sc-for list="{{artists}}" as="a" hint-placeholder-count="9">
<li><button class="row" type="button" onMouseEnter="{{a.pick}}" onFocus="{{a.pick}}" onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="{{a.rowStyle}}">
<span class="lbl" style="font-size: 11px; color: #73669a; width: 28px">{{a.num}}</span>
<span class="disp" style="{{a.nameStyle}}">{{a.name}}</span>
<span class="lbl" style="margin-left: auto; font-size: 11px; color: #a99fc2">{{a.meta}}</span>
</button></li>
</sc-for>
</ol>
<article style="position: sticky; top: 24px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: #161022">
<div class="ph" style="height: 300px; background: #1d1430; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%"><g fill="none" stroke="#2e2645" stroke-width="1"><circle cx="200" cy="105" r="24"></circle><circle cx="200" cy="105" r="48"></circle><circle cx="200" cy="105" r="72"></circle><circle cx="200" cy="105" r="96"></circle><circle cx="200" cy="105" r="120"></circle><circle cx="200" cy="105" r="144"></circle><circle cx="200" cy="105" r="168"></circle><circle cx="200" cy="105" r="192"></circle></g></svg><span class="disp" style="{{initialStyle}}">{{cur.initial}}</span><span class="lbl" style="position: absolute; left: 14px; top: 14px; padding: 5px 9px; border-radius: 4px; font-size: 10px; background: #0a0712">{{cur.format}}</span><span class="lbl" style="position: absolute; left: 14px; bottom: 14px; font-size: 10px; color: #a99fc2">[Portrait duotone]</span></div>
<div style="{{bodyStyle}}">
<span class="lbl" style="font-size: 11px; color: #b98bff">{{cur.genres}}</span>
<span class="disp" style="font-size: 36px; font-weight: 800; line-height: .95">{{cur.name}}</span>
<p style="margin: 0; font-size: 15px; color: #a99fc2">{{cur.bio}}</p>
<div style="display: flex; align-items: center; gap: 20px; padding-top: 6px">
<a class="btn btn-lotus" href="Artistes.dc.html" style="min-height: 44px">Voir la fiche</a>
<a class="lnk" href="Artistes.dc.html#booking">Booker <span class="ar" aria-hidden="true">→</span></a>
</div>
</div>
</article>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cur: 0, tick: 0 };
  }
  renderVals() {
    const roster = [
      { name: 'Originz', format: 'DJset', genres: ['Psytrance', 'Forest', 'Psytech'], bio: 'Activiste de la psytrance à Lyon depuis 2014, co-fondateur d’Outrance et programmateur pour Hadra.' },
      { name: 'Rayzorks', format: 'DJset', genres: ['Forest', 'Darkpsy'] },
      { name: 'Moonwave', format: 'DJset', genres: ['Fullon', 'Psygroovy'] },
      { name: 'Namdak', format: 'Live', genres: ['Psygroovy'] },
      { name: 'Klaak', format: 'DJset', genres: ['Hitech'], bio: 'Co-fondateur de l’association, premier set chez Outrance en closing de la Psychedelic Christmas 2025.' },
      { name: 'Soul Edge', format: 'DJset', genres: ['Psyprog', 'Fullon'] },
      { name: 'Kangapta', format: 'DJset', genres: ['Fullon', 'Psychedelic', 'Psytechno'] },
      { name: 'Marsupial', format: 'Live', genres: ['Progressive'] },
      { name: 'Rajax', format: 'DJset', genres: ['Psytrance', 'Forest'] }
    ];
    const meta = (a) => a.format + ' ◉ ' + a.genres.join('/');
    const bio = (a) => a.bio || 'Biographie à venir. [À compléter]';

    const c = this.state.cur;
    const a = roster[c];
    return {
      artists: roster.map((r, i) => {
        const on = i === c;
        return {
          num: String(i + 1).padStart(2, '0'), name: r.name, meta: meta(r), on: on ? 'true' : 'false',
          pick: () => { if (this.state.cur !== i) this.setState({ cur: i, tick: this.state.tick + 1 }); },
          rowStyle: 'box-shadow: inset 3px 0 0 ' + (on ? '#b98bff' : 'transparent') + '; background: ' + (on ? '#161022' : 'transparent'),
          nameStyle: 'font-size: 28px; font-weight: 800; line-height: 1; transition: color .25s, transform .35s cubic-bezier(.2,.7,.2,1); color: ' + (on ? '#b98bff' : '#f4f0fb') + '; transform: translateX(' + (on ? 8 : 0) + 'px)'
        };
      }),
      cur: { name: a.name, initial: a.name[0], format: a.format, genres: a.genres.join('/'), bio: bio(a) },
      initialStyle: 'position: relative; font-size: 180px; font-weight: 800; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px #b98bff; animation: pop .6s cubic-bezier(.2,.7,.2,1) both; animation-name: ' + (this.state.tick % 2 ? 'pop' : 'pop2'),
      bodyStyle: 'display: flex; flex-direction: column; gap: 12px; padding: 24px 28px 28px; animation: .5s cubic-bezier(.2,.7,.2,1) both; animation-name: ' + (this.state.tick % 2 ? 'up' : 'up2')
    };
  }
}
</script>
</body>
</html>
